[project]
name = "comfyui-graph-validate"
version = "0.1.0"
description = "Validate a ComfyUI API-format graph against /object_info before you spend GPU time or API credit."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
graph-validate = "comfyui_graph_validate.core:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfyui_graph_validate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
